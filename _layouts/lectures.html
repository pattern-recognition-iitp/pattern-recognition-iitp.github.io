---
layout: page
---

{{ content }}

<style>
.lecture-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 30px;
    margin-top: 30px;
}

.lecture-link {
    text-decoration: none;
    color: inherit;
}

.lecture-card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 18px;
    text-align: center;
    transition: all .2s ease;
}

.lecture-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0,0,0,.15);
    cursor: pointer;
}

.lecture-card img {
    width: 180px;
    height: 100px;
    object-fit: cover;
    display: block;
    margin: 0 auto 15px;
    border-radius: 6px;
}

.lecture-card h3 {
    font-family: "Times New Roman", Times, serif;
    font-size: 26px;
    font-weight: normal;
    font-style: normal;
    color: #222;
    margin: 0;
    line-height: 1.3;
}

@media (max-width:1000px) {
    .lecture-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width:700px) {
    .lecture-grid {
        grid-template-columns: 1fr;
    }
}
</style>

<div class="lecture-grid">

{% for lecture in site.lectures %}

<a class="lecture-link"
   href="{{ lecture.links.first.url | prepend: site.baseurl }}"
   target="_blank">

    <div class="lecture-card">

        {% if lecture.thumbnail %}
        <img src="{{ lecture.thumbnail | prepend: site.baseurl }}"
             alt="{{ lecture.title }}">
        {% endif %}

        <h3>{{ lecture.title }}</h3>

    </div>

</a>

{% endfor %}

</div>
