<script>
  (function () {
    // Mon=1, Tue=2, Thu=4
    const WANTED = new Set([1, 2, 4]);

    const VENUE_BY_DAY = {
      1: 'LT101', // Monday
      2: 'LT001', // Tuesday
      4: 'LT101'  // Thursday
    };

    const TIME_BY_DAY = {
      1: '3:00&nbsp;PM – 3:55&nbsp;PM', // Monday
      2: '3:00&nbsp;PM – 3:55&nbsp;PM', // Tuesday
      4: '3:00&nbsp;PM – 3:55&nbsp;PM'  // Thursday
    };

    const root = document.currentScript.parentElement; // <ul> wrapper

    const fmtDate = new Intl.DateTimeFormat(undefined, {
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    });

    const fmtDay = new Intl.DateTimeFormat(undefined, {
      weekday: 'long'
    });

    const now = new Date();

    const today = new Date(now);
    today.setHours(0, 0, 0, 0);

    const next = [];

    for (let i = 0; next.length < 3; i++) {
      const d = new Date(today.getTime() + i * 86400000);

      // Skip today's lecture if 3:55 PM has already passed
      if (
        d.getTime() === today.getTime() &&
        (now.getHours() > 15 ||
          (now.getHours() === 15 && now.getMinutes() >= 55))
      ) {
        continue;
      }

      if (WANTED.has(d.getDay())) {
        next.push(d);
      }
    }

    const rowsHTML = next.map(d => `
      <li class="table-row">
        <div class="col col-1" data-label="Event">Lecture</div>

        <div class="col col-1-2" data-label="Date">
          ${fmtDate.format(d)}
          <br class="date-spliter"/>${fmtDay.format(d)}
        </div>

        <div class="col col-1-2" data-label="Time">
          ${TIME_BY_DAY[d.getDay()] || ''}
        </div>

        <div class="col col-1-2" data-label="Venue">
          ${VENUE_BY_DAY[d.getDay()] || ''}
        </div>
      </li>
    `).join('');

    root.insertAdjacentHTML('beforeend', rowsHTML);
  })();
</script>
